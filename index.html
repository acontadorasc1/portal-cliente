header.top .in{max-width:640px;margin:0 auto}
.brand{font-family:var(--serif);font-size:21px;font-weight:700;letter-spacing:.2px}
.brand small{display:block;font-family:var(--sans);font-size:13.5px;font-weight:400;color:var(--soft);margin-top:4px}
.ver{display:inline-block;margin-top:6px;font-size:11px;background:var(--tint);color:var(--pine);padding:2px 10px;border-radius:99px}
.demo{background:var(--amber-bg);color:var(--amber);border:1px solid #E2CFA4;border-radius:10px;padding:10px 12px;font-size:13.5px;margin:16px 0}
.steps{display:flex;gap:6px;margin:18px 0 6px}
.steps div{flex:1;height:5px;border-radius:9px;background:var(--line)}
.steps div.on{background:var(--pine)}
.steplabel{font-size:13px;color:var(--soft);margin-bottom:10px}
h1{font-weight:400;font-family:var(--serif);font-size:24px;line-height:1.25;margin:4px 0 6px}
h2{font-weight:400;font-family:var(--serif);font-size:19px;margin:22px 0 8px}
p.lead{color:var(--soft);margin:0 0 16px}
.card{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.choice{display:block;width:100%;text-align:left;background:var(--raised);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0;font:inherit;color:inherit;cursor:pointer}
.choice b{display:block;font-size:16.5px}
.choice span{font-size:14px;color:var(--soft)}
.choice.sel{border-color:var(--pine);box-shadow:0 0 0 2px var(--pine) inset;background:var(--tint)}
label.f{display:block;margin:14px 0 4px;font-weight:600;font-size:14.5px}
label.f em{font-style:normal;font-weight:400;color:var(--soft);font-size:13px}
.hint{font-size:13px;color:var(--soft);margin-top:3px}
input[type=text],input[type=email],input[type=tel],input[type=date],select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:rgba(255,255,255,.8);color:var(--ink)}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pine)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.row3{display:grid;grid-template-columns:2fr 1fr;gap:0 12px}
@media(max-width:420px){.row,.row3{grid-template-columns:1fr}}
.checks label{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;margin:8px 0;background:rgba(255,255,255,.72);cursor:pointer}
.checks input{width:20px;height:20px;accent-color:var(--pine)}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{flex:1;min-width:90px;text-align:center;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:rgba(255,255,255,.72);cursor:pointer}
.radios input{display:none}
.radios label.sel{border-color:var(--pine);background:var(--tint);font-weight:600}
.socio{border-left:4px solid var(--pine-l)}
.socio .hd{display:flex;justify-content:space-between;align-items:center}
.socio .hd b{font-family:var(--serif);font-size:17px}
button.link{background:none;border:none;color:var(--stamp);font:inherit;font-size:14px;cursor:pointer;padding:4px}
.btn{display:inline-block;font:inherit;font-weight:600;border-radius:12px;padding:13px 20px;border:none;cursor:pointer}
.btn.pri{background:var(--pine);color:#fff}
.btn.sec{background:#fff;color:var(--pine);border:1.5px solid var(--pine)}
.btn.add{width:100%;background:rgba(255,255,255,.72);color:var(--pine);border:1.5px dashed var(--pine-l);margin-top:6px}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(247,247,247,.96);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.nav .in{max-width:640px;margin:0 auto;display:flex;gap:10px;justify-content:space-between}
.nav .btn{flex:1}
.doc{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:12px;padding:12px;background:rgba(255,255,255,.72);margin:10px 0}
.doc .t{font-weight:600;font-size:14.5px}
.doc .t .opt{font-weight:400;color:var(--soft);font-size:12.5px}
.doc .act{display:flex;gap:8px;flex-wrap:wrap}
.doc .act label{font-size:14px;padding:8px 12px;border-radius:9px;border:1.5px solid var(--pine-l);color:var(--pine);cursor:pointer;font-weight:600}
.doc .act input{display:none}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--ok-bg);color:var(--ok);font-size:13px;padding:4px 10px;border-radius:99px;margin:2px 4px 2px 0}
.chip button{background:none;border:none;color:var(--ok);font-size:15px;cursor:pointer;padding:0}
.err{background:var(--stamp-bg);color:var(--stamp);border-radius:10px;padding:10px 12px;font-size:14px;margin:12px 0}
.rev dt{font-size:12.5px;color:var(--soft);margin-top:8px}
.rev dd{margin:0;font-weight:500;white-space:pre-wrap;word-break:break-word}
.ok-big{text-align:center;padding:30px 10px}
.ok-big .ic{width:64px;height:64px;border-radius:50%;background:var(--ok-bg);color:var(--ok);font-size:34px;line-height:64px;margin:0 auto 12px}
.small{font-size:13px;color:var(--soft)}
.cnae{display:grid;grid-template-columns:1fr auto;gap:8px;margin:6px 0}
</style>

// --- construtores de campos ---
function campo(path,label,{tipo="text",hint="",ph="",opt=false,area=false}={}){
  const v=esc(get(path));
  const lab=`<label class="f">${label}${opt?' <em>(se tiver)</em>':''}</label>`;
  const inp=area?`<textarea data-p="${path}" placeholder="${esc(ph)}">${v}</textarea>`:`<input type="${tipo}" data-p="${path}" value="${v}" placeholder="${esc(ph)}" ${tipo==="tel"?'inputmode="tel"':''}>`;
  return `<div>${lab}${inp}${hint?`<div class="hint">${hint}</div>`:""}</div>`;
}
function sel(path,label,opts,{hint=""}={}){
  const v=get(path);
  return `<div><label class="f">${label}</label><select data-p="${path}">${opts.map(o=>`<option ${o===v?"selected":""} value="${esc(o)}">${o||"Selecione…"}</option>`).join("")}</select>${hint?`<div class="hint">${hint}</div>`:""}</div>`;
}
function radios(path,label,opts,hint=""){
  const v=get(path);
  return `<div><label class="f">${label}</label><div class="radios">${opts.map(o=>`<label class="${o===v?"sel":""}"><input type="radio" data-r="${path}" value="${esc(o)}" ${o===v?"checked":""}>${o}</label>`).join("")}</div>${hint?`<div class="hint">${hint}</div>`:""}</div>`;
}
function endereco(path,titulo){

   ${campo(path+".bairro","Bairro")}
   <div class="row3">${campo(path+".cidade","Cidade")}${sel(path+".uf","Estado",UFS)}</div></div>`;
}
function atividades(prefixo,titulo,hint){

}
// Divide o campo único de atividades em principal + secundárias (formato do extrator)
function lerAtividades(txt){
  return String(txt||"").split(/\n+/).map(l=>l.replace(/^[\s\-•;,]+|[\s;,]+$/g,"")).filter(Boolean).map(l=>{
    const m=l.match(/^(\d{2}[.\s]?\d{2}-?\d[-/]?\d{2})\s*[-–—:]?\s*(.*)$/);
    return m?{codigo:m[1].trim(),descricao:m[2].trim()}:{codigo:"",descricao:l};
  });
}

function montarFicha(){

  e.atividades_secundarias=atv.slice(1);
  if(e.optante_simples!=="Sim") e.regime_simples="";
  if(t!=="alteracao"){e.alteracoes=[];e.novos=emptyEmpresa().novos;}
  if(t==="alteracao"&&e.alteracoes.includes("atividades")&&!e.novos.objeto_social.trim()) e.novos.objeto_social=atv.map(a=>a.descricao||a.codigo).filter(Boolean).map(x=>"- "+x+";").join("\n");
  if(t==="alteracao"&&!e.alteracoes.includes("endereco")) e.endereco=emptyEndereco();
  if(t.endsWith("filial")) e.endereco=S.filial.endereco;
  const m=modoSocios();
  const socios=m==="nenhum"?[]:S.socios.map(x=>({...x}));
  if(m!=="alteracao") socios.forEach(x=>{x.situacao="";x.participacao_anterior=""});
  const obs=[];
  if(t==="abertura"&&S.opcoes_nome.some(Boolean)) obs.push("Outras opções de nome: "+S.opcoes_nome.filter(Boolean).join(" / "));
  if(S.debitos) obs.push("Débitos/pendências informados pelo cliente: "+S.debitos);
  if(t.endsWith("filial")) obs.push(TIPOS[t].label+(S.filial.cnpj_filial?" — CNPJ da filial: "+S.filial.cnpj_filial:""));
  if(S.obs) obs.push("Observação do cliente: "+S.obs);
  return {
    formato:"ficha-portal-cliente", versao_portal:6,
    enviado_em:new Date().toISOString(),
    tipo: t==="abertura_filial"||t==="extincao_filial"? t : t,
    tipo_extrator: t==="abertura_filial"?"abertura":t==="extincao_filial"?"baixa":t,
    contato:S.contato,
    data:{empresa:e,socios,observacoes:obs.join("\n")},
    documentos:listaEnvio().map(x=>({item:x.item,arquivo:x.nome,original:x.file.name,tamanho_kb:Math.round(x.file.size/1024)})),
  };
}
function L(label,v){return v&&String(v).trim()?`<dt>${label}</dt><dd>${esc(v)}</dd>`:""}
function fmtEnd(a){return a&&a.logradouro?`${a.logradouro}, ${a.numero}${a.complemento?" — "+a.complemento:""}, ${a.bairro}, ${a.cidade}/${a.uf}, CEP ${a.cep}`:""}
function tela4(){
  const f=montarFicha(),e=f.data.empresa;
  const altTxt=e.alteracoes.map(k=>TIPOS_ALTERACAO.find(a=>a.key===k)?.label).join(", ");
  return `<div class="steplabel">Passo 5 de ${PASSOS.length}</div><h1>Confira antes de enviar</h1>
  <p class="lead">Se algo estiver errado, use <b>Voltar</b> para corrigir.</p>
  <div class="card"><dl class="rev">${L("Processo",TIPOS[S.tipo].label)}${L("O que muda",altTxt)}${L("Quem está enviando",[S.contato.nome,S.contato.telefone,S.contato.email].filter(Boolean).join(" · "))}
  ${L("CNPJ",e.cnpj)}${L("Razão social",e.razao_social)}${L("Nome fantasia",e.nome_fantasia)}${L("Tipo de empresa",e.natureza_juridica)}${L("Capital social",e.capital_social)}
  ${L("Nova razão social",e.novos.razao_social)}${L("Novo nome fantasia",e.novos.nome_fantasia)}${L("Novo capital",e.novos.capital_social)}${L("Novo porte",e.novos.porte)}${L("Nova natureza jurídica",e.novos.natureza_juridica)}
  ${L("Porte",e.porte)}${L("Simples Nacional",[e.optante_simples,e.regime_simples].filter(Boolean).join(" · "))}${L("Atividades",[e.atividade_principal,...e.atividades_secundarias].filter(a=>a.descricao||a.codigo).map((a,i)=>(i?"":"Principal: ")+[a.codigo,a.descricao].filter(Boolean).join(" ")).join("\n"))}${L("Objeto social",e.objeto_social||(e.alteracoes.includes("atividades")?e.novos.objeto_social:""))}
  ${L("Endereço",fmtEnd(e.endereco))}${L("Motivo",e.motivo_baixa)}${L("Data de encerramento",e.data_encerramento)}${L("Detalhes",e.tipo_alteracao)}${L("Observações",f.data.observacoes)}
  ${f.data.socios.map((x,i)=>L((modoSocios()==="responsavel"?"Responsável":"Sócio "+(i+1)),[x.nome,x.cpf&&"CPF "+x.cpf,x.participacao&&x.participacao+"%",x.situacao,x.administrador&&"administrador"].filter(Boolean).join(" · "))).join("")}
  ${L("Documentos anexados",f.documentos.length?f.documentos.map(d=>"• "+d.arquivo).join("\n"):"nenhum")}</dl></div>
  <div class="checks"><label><input type="checkbox" id="lgpd" ${S._lgpd?"checked":""}>Autorizo o escritório a usar estes dados e documentos somente para este processo, conforme a Lei Geral de Proteção de Dados (LGPD).</label></div>
  ${progresso?`<div class="demo" style="text-align:center"><b>${esc(progresso)}</b><br>Não feche esta página até aparecer "Recebido!".</div>`:""}
  ${erroEnvio?`<div class="err"><b>Não foi possível enviar:</b> ${esc(erroEnvio)}.<br>Confira sua internet e toque em <b>Enviar</b> de novo. Seus dados continuam aqui.</div>`:""}`;
}
function telaFim(){
  return `<div class="ok-big"><div class="ic">✓</div><h1>Recebido!</h1><p class="lead">O escritório vai conferir seus dados e documentos e falar com você se faltar alguma coisa.</p></div>
  <div style="text-align:center"><button class="btn sec" id="recomecar">Enviar outro processo</button></div>`;
}

// ===== Envio para o Drive =====
function limpaNome(t){return String(t).replace(/[\\/:*?"<>|#%]+/g," ").replace(/\s+/g," ").trim().slice(0,120)}
function listaEnvio(){
  const docs=docsDoTipo(S);let n=0;
  return Object.entries(FILES).flatMap(([k,fs])=>{const d=docs.find(x=>x.k===k);const item=d?.t||k;
    return fs.map(f=>{n++;const ext=(f.name.match(/\.[a-z0-9]{2,5}$/i)||[""])[0];
      return{k,item,file:f,nome:limpaNome(String(n).padStart(2,"0")+" - "+item+" - "+f.name.replace(/\.[a-z0-9]{2,5}$/i,""))+ext.toLowerCase()}})});
}
function lerBase64(blob){return new Promise((ok,er)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=()=>er(new Error("não consegui ler o arquivo"));r.readAsDataURL(blob)})}
// Foto grande é reduzida (continua legível) para o envio ser mais rápido
async function prepararArquivo(f){
  if(!/^image\/(jpeg|png|webp|heic|heif)$/i.test(f.type)||f.size<1.5e6) return {blob:f,tipo:f.type||"application/octet-stream"};
  try{
    const img=await createImageBitmap(f);const m=2400,esc=Math.min(1,m/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=Math.round(img.width*esc);c.height=Math.round(img.height*esc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    const b=await new Promise(ok=>c.toBlob(ok,"image/jpeg",.85));return b?{blob:b,tipo:"image/jpeg",jpg:true}:{blob:f,tipo:f.type};
  }catch(e){return {blob:f,tipo:f.type}}
}
async function chamar(dados){
  let ultimo;
  for(let t=0;t<3;t++){
    try{
      const r=await fetch(ENDERECO_RECEBEDOR,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(dados)});
      const j=await r.json();if(!j.ok) throw new Error(j.erro||"erro no recebimento");return j;
    }catch(e){ultimo=e;await new Promise(ok=>setTimeout(ok,1500*(t+1)))}
  }
  throw ultimo;
}
let enviando=false, progresso="", erroEnvio="";
async function enviar(){
  if(enviando) return; enviando=true; erroEnvio=""; render();
  try{
    if(ENDERECO_RECEBEDOR.startsWith("COLE_")) throw new Error("o portal ainda não está ligado ao Google Drive do escritório");
    const lista=listaEnvio();
    for(const x of lista){ if(x.file.size>40e6) throw new Error(`o arquivo "${x.file.name}" é grande demais (máximo 40 MB)`); }
    // nomes finais (foto convertida para .jpg muda a extensão)
    const prontos=[];
    for(const x of lista){const pr=await prepararArquivo(x.file);prontos.push({...x,...pr,nome:pr.jpg?x.nome.replace(/\.[a-z0-9]{2,5}$/i,"")+".jpg":x.nome});}
    const ficha=montarFicha();
    ficha.documentos=prontos.map(x=>({item:x.item,arquivo:x.nome,original:x.file.name,tamanho_kb:Math.round(x.blob.size/1024)}));
    progresso="Enviando seus dados…";render();
    const ini=await chamar({acao:"iniciar",ficha});
    for(let i=0;i<prontos.length;i++){
      progresso=`Enviando documento ${i+1} de ${prontos.length}…`;render();
      await chamar({acao:"arquivo",pasta:ini.pasta,token:ini.token,nome:prontos[i].nome,tipo:prontos[i].tipo,base64:await lerBase64(prontos[i].blob)});
    }
    progresso="Finalizando…";render();
    await chamar({acao:"concluir",pasta:ini.pasta,token:ini.token,total:prontos.length});
    fim=true; enviando=false; progresso="";
    try{localStorage.removeItem("portal-rascunho")}catch(e){}
    render(); scrollTo(0,0);
  }catch(e){
    enviando=false; progresso=""; erroEnvio=String(e.message||e); render(); scrollTo(0,document.body.scrollHeight);
  }
}

// ===== Validação simples por passo =====
function faltas(){
  const p=S.passo,e=S.empresa,t=S.tipo,f=[];
  if(p===0){ if(!t) f.push("escolha o tipo de processo"); if(t==="alteracao"&&!e.alteracoes.length) f.push("marque o que vai mudar"); if(!S.contato.nome) f.push("seu nome"); if(!S.contato.telefone&&!S.contato.email) f.push("um telefone ou e-mail para contato"); }
  if(p===1){ if(t!=="abertura"&&!e.cnpj) f.push("o CNPJ"); if(!e.razao_social) f.push(t==="abertura"?"o nome pretendido":"a razão social"); }
  if(p===4&&!S._lgpd) f.push("a autorização de uso dos dados");
  return f;
}

// ===== Renderização =====
let fim=false, erro="";
function render(){
  const telas=[tela0,tela1,tela2,tela3,tela4];
  const barra=`<div class="steps">${PASSOS.map((_,i)=>`<div class="${i<=S.passo?"on":""}"></div>`).join("")}</div>`;
  $("#app").innerHTML= fim? telaFim() : barra + (erro?`<div class="err">Falta preencher: ${esc(erro)}.</div>`:"") + telas[S.passo]();
  $("#nav").style.display=fim?"none":"";
  $("#bVoltar").style.visibility=S.passo===0?"hidden":"visible";
  $("#bAvancar").textContent=S.passo===4?(enviando?"Enviando…":"Enviar"):"Continuar";
  $("#bAvancar").disabled=enviando; $("#bVoltar").disabled=enviando;
}
document.addEventListener("input",ev=>{const p=ev.target.dataset.p;if(p){let v=ev.target.value;if(/\.(\d+)\./.test(p)&&p.startsWith("empresa.atividades_secundarias")){}set(p,v);}});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.dataset.p&&t.tagName==="SELECT"){set(t.dataset.p,t.value);if(/estado_civil/.test(t.dataset.p))render();}
  if(t.dataset.r){set(t.dataset.r,t.value);render();}
  if(t.dataset.alt){const a=S.empresa.alteracoes,k=t.dataset.alt;t.checked?a.includes(k)||a.push(k):a.splice(a.indexOf(k),1);salvar();}
  if(t.dataset.adm!==undefined){S.socios[+t.dataset.adm].administrador=t.checked;salvar();}
  if(t.id==="lgpd"){S._lgpd=t.checked;salvar();}
  if(t.dataset.up){const k=t.dataset.up;FILES[k]=(FILES[k]||[]).concat([...t.files]);render();}
});
document.addEventListener("click",ev=>{
  const b=ev.target.closest("button");if(!b)return;
  if(b.dataset.tipo){S.tipo=b.dataset.tipo;if(S.tipo!=="alteracao")S.empresa.alteracoes=[];salvar();render();}
  if(b.hasAttribute("data-add-socio")){S.socios.push(emptySocio());salvar();render();}
  if(b.dataset.delSocio){S.socios.splice(+b.dataset.delSocio,1);salvar();render();}
  if(b.hasAttribute("data-add-ativ")){S.empresa.atividades_secundarias.push({codigo:"",descricao:""});salvar();render();}
  if(b.dataset.delAtiv){S.empresa.atividades_secundarias.splice(+b.dataset.delAtiv,1);salvar();render();}
  if(b.dataset.rm){const[k,j]=b.dataset.rm.split(":");FILES[k].splice(+j,1);render();}
  if(b.id==="recomecar"){S=emptyState();for(const k in FILES)delete FILES[k];fim=false;salvar();render();}
});
$("#bVoltar").onclick=()=>{erro="";S.passo=Math.max(0,S.passo-1);salvar();render();scrollTo(0,0)};
$("#bAvancar").onclick=()=>{
  const f=faltas();if(f.length){erro=f.join(", ");render();scrollTo(0,0);return}
  erro="";if(S.passo===4){enviar();return}
  S.passo++;salvar();render();scrollTo(0,0);
};
render();
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
